<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP Dashboard</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#FFF5F0;color:#3a2530;padding:20px}
.w{max-width:980px;margin:auto}h1{margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid #e5cfc4;background:#fff}
button{background:#e8557a;color:#fff;border:0;cursor:pointer;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.c{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 3px 10px #0001}.c b{display:block;font-size:1.9rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f3e4dc;font-size:.92rem;white-space:nowrap}th{background:#ffe3ea}
td button{padding:5px 10px;font-size:.8rem}ul{padding-left:18px;color:#6d5560;font-size:.9rem}
</style>
</head>
<body><div class="w">
<h1>🎓 RSVP Dashboard</h1>
<div class="bar">
  <input id="key" type="password" placeholder="Dashboard key">
  <button id="go" type="button">Load</button>
  <select id="grp"><option value="">All guests</option><option value="friend">Friends</option><option value="colleague">Colleagues</option></select>
  <span id="msg"></span>
</div>
<div class="cards" id="cards"></div>
<div class="tw"><table>
  <thead><tr><th>Name</th><th>Group</th><th>Status</th><th>First opened</th><th>Last action</th><th>Link</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<h3>Recent activity</h3><ul id="feed"></ul>
</div>
<script>
const API = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";                      // same URL as in index.html
const SITE = location.href.replace(/dashboard\.html.*$/, "index.html"); // set this by hand if the dashboard is hosted elsewhere
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ST = { yes: "✅ Coming", no: "❌ Not coming", hes: "🤔 Hesitating", open: "👀 Opened", new: "⏳ Not opened" };
let DATA = null;

async function load(){
  sessionStorage.k = $("key").value; $("msg").textContent = "Loading…";
  try {
    const d = await (await fetch(API + "?action=dash&key=" + encodeURIComponent($("key").value))).json();
    if (!d.guests) { $("msg").textContent = "Wrong key."; return; }
    DATA = d; $("msg").textContent = "Updated " + new Date().toLocaleTimeString(); render();
  } catch (e) { $("msg").textContent = "Could not load. Check the API URL."; }
}
function render(){
  const by = {}; DATA.guests.forEach(g => by[g.slug] = { ...g, ev: [] });
  DATA.events.forEach(e => by[e.slug] && by[e.slug].ev.push(e));
  const f = $("grp").value, order = ["yes", "no", "hes", "open", "new"];
  const rows = Object.values(by).filter(g => !f || g.group === f).map(g => {
    const ev = g.ev, fin = [...ev].reverse().find(e => ["yes", "changed_to_yes", "final_no"].includes(e.event));
    g.st = fin ? (fin.event === "final_no" ? "no" : "yes") : ev.some(e => e.event === "no_click") ? "hes" : ev.length ? "open" : "new";
    g.first = ev.find(e => e.event === "open"); g.last = ev[ev.length - 1]; return g;
  }).sort((a, b) => order.indexOf(a.st) - order.indexOf(b.st));
  $("cards").innerHTML = order.map(s => `<div class="c"><b>${rows.filter(r => r.st === s).length}</b>${ST[s]}</div>`).join("");
  const t = e => e ? new Date(e.ts).toLocaleString() : "–";
  $("rows").innerHTML = rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.group)}</td><td>${ST[r.st]}</td><td>${t(r.first)}</td><td>${r.last ? esc(r.last.event) + " · " + t(r.last) : "–"}</td><td><button data-s="${esc(r.slug)}">Copy link</button></td></tr>`).join("");
  const nm = Object.fromEntries(DATA.guests.map(g => [g.slug, g.name]));
  $("feed").innerHTML = DATA.events.slice(-12).reverse().map(e => `<li>${esc(nm[e.slug] || e.slug)}: ${esc(e.event)} · ${new Date(e.ts).toLocaleString()}</li>`).join("");
}
$("go").onclick = load; $("grp").onchange = () => DATA && render();
$("key").value = sessionStorage.k || "";
document.addEventListener("click", e => {
  const s = e.target.dataset && e.target.dataset.s;
  if (s) { navigator.clipboard.writeText(SITE + "?g=" + s); e.target.textContent = "Copied ✓"; setTimeout(() => e.target.textContent = "Copy link", 1500); }
});
setInterval(() => DATA && load(), 30000);
</script>
</body>
</html>
